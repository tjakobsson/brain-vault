<svg xmlns="http://www.w3.org/2000/svg" width="800" height="360" viewBox="0 0 800 360" role="img" aria-labelledby="title desc">
  <title id="title">A familiar navigation path</title>
  <desc id="desc">A list screen opens a detail screen whose conventional back button returns to the list.</desc>
  <rect width="800" height="360" rx="24" fill="#f8fafc"/>
  <style>
    text { font-family: system-ui, sans-serif; fill: #0f172a; }
    .label { font-size: 16px; font-weight: 700; }
    .small { font-size: 12px; fill: #475569; }
  </style>
  <text class="label" x="215" y="34" text-anchor="middle">List</text>
  <text class="label" x="585" y="34" text-anchor="middle">Detail</text>
  <rect x="105" y="52" width="220" height="278" rx="26" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <rect x="475" y="52" width="220" height="278" rx="26" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="125" y="92" font-size="24" font-weight="750">Recipes</text>
  <g fill="#f1f5f9">
    <rect x="123" y="112" width="184" height="48" rx="10"/>
    <rect x="123" y="168" width="184" height="48" rx="10"/>
    <rect x="123" y="224" width="184" height="48" rx="10"/>
  </g>
  <text x="139" y="142" font-size="13">Tomato pasta</text>
  <text x="139" y="198" font-size="13">Mushroom soup</text>
  <text x="139" y="254" font-size="13">Apple tart</text>
  <text x="292" y="142" text-anchor="end" font-size="19" fill="#64748b">›</text>
  <path d="M337 136 H449" fill="none" stroke="#2563eb" stroke-width="3"/>
  <path d="M437 127 L451 136 L437 145" fill="none" stroke="#2563eb" stroke-width="3"/>
  <text class="small" x="394" y="120" text-anchor="middle">Tap row</text>
  <text x="495" y="91" font-size="13" fill="#2563eb">‹ Recipes</text>
  <rect x="495" y="112" width="180" height="84" rx="12" fill="#dbeafe"/>
  <text x="495" y="226" font-size="22" font-weight="750">Tomato pasta</text>
  <rect x="495" y="244" width="172" height="11" rx="5" fill="#cbd5e1"/>
  <rect x="495" y="263" width="142" height="11" rx="5" fill="#cbd5e1"/>
  <path d="M463 305 H350" fill="none" stroke="#2563eb" stroke-width="3"/>
  <path d="M362 296 L348 305 L362 314" fill="none" stroke="#2563eb" stroke-width="3"/>
  <text class="small" x="405" y="327" text-anchor="middle">Back returns to the list</text>
</svg>
