<svg xmlns="http://www.w3.org/2000/svg" width="800" height="380" viewBox="0 0 800 380" role="img" aria-labelledby="title desc">
  <title id="title">One interface adapts to narrow and wide space</title>
  <desc id="desc">A narrow layout stacks content while a wide layout places related content in two columns.</desc>
  <rect width="800" height="380" rx="24" fill="#f8fafc"/>
  <style>
    text { font-family: system-ui, sans-serif; fill: #0f172a; }
    .label { font-size: 16px; font-weight: 700; }
    .small { font-size: 13px; fill: #475569; }
    .inverse { fill: #ffffff; }
  </style>
  <text class="label" x="190" y="34" text-anchor="middle">Narrow space</text>
  <text class="label" x="570" y="34" text-anchor="middle">Wide space</text>
  <rect x="80" y="52" width="220" height="300" rx="28" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <rect x="350" y="52" width="400" height="300" rx="28" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="102" y="91" font-size="22" font-weight="750">Tomato pasta</text>
  <rect x="102" y="108" width="176" height="86" rx="12" fill="#dbeafe"/>
  <text x="102" y="224" font-size="14" font-weight="700">Ingredients</text>
  <rect x="102" y="238" width="166" height="10" rx="5" fill="#cbd5e1"/>
  <rect x="102" y="257" width="140" height="10" rx="5" fill="#cbd5e1"/>
  <rect x="102" y="276" width="156" height="10" rx="5" fill="#cbd5e1"/>
  <rect x="102" y="305" width="176" height="31" rx="10" fill="#2563eb"/>
  <text class="inverse" x="190" y="325" text-anchor="middle" font-size="12" font-weight="700">Start cooking</text>
  <text x="374" y="91" font-size="22" font-weight="750">Tomato pasta</text>
  <rect x="374" y="108" width="166" height="146" rx="12" fill="#dbeafe"/>
  <text x="568" y="124" font-size="14" font-weight="700">Ingredients</text>
  <rect x="568" y="139" width="154" height="10" rx="5" fill="#cbd5e1"/>
  <rect x="568" y="158" width="132" height="10" rx="5" fill="#cbd5e1"/>
  <rect x="568" y="177" width="144" height="10" rx="5" fill="#cbd5e1"/>
  <rect x="568" y="206" width="154" height="38" rx="11" fill="#2563eb"/>
  <text class="inverse" x="645" y="230" text-anchor="middle" font-size="12" font-weight="700">Start cooking</text>
  <rect x="374" y="272" width="348" height="11" rx="5" fill="#cbd5e1"/>
  <rect x="374" y="293" width="298" height="11" rx="5" fill="#cbd5e1"/>
  <text class="small" x="190" y="372" text-anchor="middle">Stack related regions</text>
  <text class="small" x="550" y="372" text-anchor="middle">Use columns when space permits</text>
</svg>
