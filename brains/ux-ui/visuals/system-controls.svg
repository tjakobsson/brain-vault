<svg xmlns="http://www.w3.org/2000/svg" width="800" height="360" viewBox="0 0 800 360" role="img" aria-labelledby="title desc">
  <title id="title">System controls communicate their behavior</title>
  <desc id="desc">A switch, button, and text field are paired with the jobs people expect them to perform.</desc>
  <rect width="800" height="360" rx="24" fill="#f8fafc"/>
  <style>
    text { font-family: system-ui, sans-serif; fill: #0f172a; }
    .label { font-size: 16px; font-weight: 700; }
    .small { font-size: 13px; fill: #475569; }
    .inverse { fill: #ffffff; }
  </style>
  <text class="label" x="400" y="38" text-anchor="middle">Match the component to the job</text>
  <g transform="translate(82 74)">
    <rect width="196" height="220" rx="20" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="98" y="38" text-anchor="middle" font-size="14" font-weight="700">On or off</text>
    <rect x="66" y="74" width="64" height="38" rx="19" fill="#22c55e"/>
    <circle cx="111" cy="93" r="16" fill="#ffffff"/>
    <text class="small" x="98" y="148" text-anchor="middle">Use a switch</text>
    <text class="small" x="98" y="174" text-anchor="middle">Wi-Fi</text>
  </g>
  <g transform="translate(302 74)">
    <rect width="196" height="220" rx="20" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="98" y="38" text-anchor="middle" font-size="14" font-weight="700">Perform an action</text>
    <rect x="42" y="74" width="112" height="40" rx="12" fill="#2563eb"/>
    <text class="inverse" x="98" y="99" text-anchor="middle" font-size="13" font-weight="700">Save recipe</text>
    <text class="small" x="98" y="148" text-anchor="middle">Use a button</text>
    <text class="small" x="98" y="174" text-anchor="middle">Runs when tapped</text>
  </g>
  <g transform="translate(522 74)">
    <rect width="196" height="220" rx="20" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="98" y="38" text-anchor="middle" font-size="14" font-weight="700">Enter text</text>
    <rect x="26" y="74" width="144" height="40" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
    <text x="40" y="99" font-size="13" fill="#64748b">Recipe name</text>
    <text class="small" x="98" y="148" text-anchor="middle">Use a text field</text>
    <text class="small" x="98" y="174" text-anchor="middle">Accepts typed input</text>
  </g>
</svg>
