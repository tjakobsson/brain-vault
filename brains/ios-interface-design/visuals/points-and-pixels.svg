<svg xmlns="http://www.w3.org/2000/svg" width="800" height="360" viewBox="0 0 800 360" role="img" aria-labelledby="title desc">
  <title id="title">Points map to different pixel counts</title>
  <desc id="desc">The same 44 point target maps to 88 pixels at two-times scale and 132 pixels at three-times scale.</desc>
  <rect width="800" height="360" rx="24" fill="#f8fafc"/>
  <style>
    text { font-family: system-ui, sans-serif; fill: #0f172a; }
    .label { font-size: 16px; font-weight: 700; }
    .small { font-size: 13px; fill: #475569; }
  </style>
  <text class="label" x="400" y="38" text-anchor="middle">The layout size stays 44 points</text>
  <g transform="translate(92 72)">
    <text x="132" y="0" text-anchor="middle" font-size="14" font-weight="700">2x display</text>
    <rect x="66" y="30" width="132" height="132" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
    <g stroke="#93c5fd" stroke-width="1">
      <path d="M99 30 V162 M132 30 V162 M165 30 V162"/>
      <path d="M66 63 H198 M66 96 H198 M66 129 H198"/>
    </g>
    <circle cx="132" cy="96" r="18" fill="#2563eb"/>
    <text class="small" x="132" y="192" text-anchor="middle">44 pt = 88 px</text>
  </g>
  <path d="M376 146 H424" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 5"/>
  <text class="small" x="400" y="132" text-anchor="middle">same apparent size</text>
  <g transform="translate(444 72)">
    <text x="132" y="0" text-anchor="middle" font-size="14" font-weight="700">3x display</text>
    <rect x="66" y="30" width="132" height="132" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
    <g stroke="#93c5fd" stroke-width="0.8">
      <path d="M88 30 V162 M110 30 V162 M132 30 V162 M154 30 V162 M176 30 V162"/>
      <path d="M66 52 H198 M66 74 H198 M66 96 H198 M66 118 H198 M66 140 H198"/>
    </g>
    <circle cx="132" cy="96" r="18" fill="#2563eb"/>
    <text class="small" x="132" y="192" text-anchor="middle">44 pt = 132 px</text>
  </g>
  <text class="small" x="400" y="326" text-anchor="middle">Points describe the interface. Pixels describe the display.</text>
</svg>
