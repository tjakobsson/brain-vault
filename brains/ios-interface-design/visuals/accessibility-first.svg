<svg xmlns="http://www.w3.org/2000/svg" width="800" height="380" viewBox="0 0 800 380" role="img" aria-labelledby="title desc">
  <title id="title">A layout planned for larger text</title>
  <desc id="desc">A rigid row clips large text while an adaptive row grows vertically and preserves the complete label.</desc>
  <rect width="800" height="380" rx="24" fill="#f8fafc"/>
  <style>
    text { font-family: system-ui, sans-serif; fill: #0f172a; }
    .label { font-size: 16px; font-weight: 700; }
    .small { font-size: 13px; fill: #475569; }
  </style>
  <text class="label" x="215" y="38" text-anchor="middle">Fixed after the fact</text>
  <text class="label" x="585" y="38" text-anchor="middle">Flexible from the start</text>
  <rect x="76" y="70" width="278" height="236" rx="22" fill="#ffffff" stroke="#cbd5e1"/>
  <rect x="446" y="70" width="278" height="236" rx="22" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="98" y="104" font-size="14" font-weight="700">Standard text size</text>
  <rect x="98" y="120" width="234" height="42" rx="9" fill="#f1f5f9"/>
  <text x="112" y="146" font-size="14">Download over cellular</text>
  <rect x="98" y="180" width="234" height="42" rx="9" fill="#fee2e2" stroke="#ef4444"/>
  <text x="112" y="209" font-size="24">Download over cell…</text>
  <text class="small" x="215" y="258" text-anchor="middle">Large text is clipped</text>
  <text x="468" y="104" font-size="14" font-weight="700">Rows can grow</text>
  <rect x="468" y="120" width="234" height="42" rx="9" fill="#f1f5f9"/>
  <text x="482" y="146" font-size="14">Download over cellular</text>
  <rect x="468" y="180" width="234" height="84" rx="9" fill="#dcfce7" stroke="#16a34a"/>
  <text x="482" y="211" font-size="24">Download over</text>
  <text x="482" y="241" font-size="24">cellular</text>
  <text class="small" x="585" y="286" text-anchor="middle">Large text wraps</text>
  <text class="small" x="400" y="348" text-anchor="middle">Accessibility changes the structure of the layout, not only its settings.</text>
</svg>
